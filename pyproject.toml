[project]
name = "pymodularity"
version = "0.3.0"
description = "See and check a repo's real Python imports: a privacy convention on PEP 8 underscores, an import-cycle ban, and a coupling report, all derived from the code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tilo Himmelsbach" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/dertilo/pymodularity"
Repository = "https://github.com/dertilo/pymodularity"
Issues = "https://github.com/dertilo/pymodularity/issues"

[project.scripts]
pymodularity = "pymodularity.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty==0.0.90",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"
# a static fixture repo, not real project code: committed golden-test input
exclude = ["tests/showcase"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
# a static fixture repo, not real project code: committed golden-test input
exclude = ["tests/showcase"]
