[project]
name = "pymodularity"
version = "0.2.0"
description = "See and check a repo's real Python imports: a privacy convention on PEP 8 underscores, an import-cycle ban, and a coupling report, all derived from the code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tilo Himmelsbach" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/dertilo/pymodularity"
Repository = "https://github.com/dertilo/pymodularity"
Issues = "https://github.com/dertilo/pymodularity/issues"

[project.scripts]
pymodularity = "pymodularity.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "basedpyright"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
reportUnusedCallResult = false
reportAny = false
# tests exercise private helpers directly
executionEnvironments = [{ root = "tests", reportPrivateUsage = false }]
