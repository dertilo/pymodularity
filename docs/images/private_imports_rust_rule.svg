<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="15">
<defs>
<marker id="g" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
<marker id="r" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<rect x="30" y="30" width="300" height="540" rx="6" fill="#EEF2F7" stroke="#1F2937" stroke-width="1.2"/>
<text x="40" y="52" font-weight="bold" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">app/</text>
<rect x="60" y="70" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="70" y="92" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">main.py</text>
<rect x="60" y="130" width="240" height="320" rx="6" fill="#EEF2F7" stroke="#1F2937" stroke-width="1.2"/>
<text x="70" y="152" font-weight="bold" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">orders/</text>
<rect x="90" y="170" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="100" y="192" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">__init__.py</text>
<text x="100" y="212" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#1F2937">_registry</text>
<rect x="90" y="240" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="100" y="262" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">api.py</text>
<rect x="90" y="292" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="100" y="314" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">_pricing.py</text>
<text x="100" y="334" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#1F2937">rate</text>
<text x="210" y="334" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#C0392B">_rate</text>
<rect x="90" y="362" width="180" height="76" rx="6" fill="#EEF2F7" stroke="#1F2937" stroke-width="1.2"/>
<text x="100" y="384" font-weight="bold" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">batch/</text>
<rect x="110" y="396" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="120" y="418" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">job.py</text>
<rect x="60" y="470" width="240" height="80" rx="6" fill="#EEF2F7" stroke="#1F2937" stroke-width="1.2"/>
<text x="70" y="492" font-weight="bold" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">billing/</text>
<rect x="90" y="506" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
<text x="100" y="528" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#1F2937">invoice.py</text>
<line x1="270" y1="257" x2="300" y2="257" stroke="#1F2937" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="270" y1="318" x2="300" y2="318" stroke="#1F2937" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="270" y1="413" x2="300" y2="413" stroke="#1F2937" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="270" y1="523" x2="300" y2="523" stroke="#1F2937" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M300,87 C530,87 530,304 302,304" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#r)" stroke-dasharray="6,4"/>
<text x="480.5" y="200.5" font-size="13" fill="#C0392B" font-weight="bold">✗ parent</text>
<path d="M300,257 C360,257 360,312 302,312" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#g)"/>
<text x="348" y="289.5" font-size="13" fill="#2E8B57" font-weight="bold">✓ owner</text>
<path d="M300,413 C360,413 360,324 302,324" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#g)"/>
<text x="348" y="373.5" font-size="13" fill="#2E8B57" font-weight="bold">✓ descendant</text>
<path d="M300,523 C450,523 450,332 302,332" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#r)" stroke-dasharray="6,4"/>
<text x="420.5" y="432.5" font-size="13" fill="#C0392B" font-weight="bold">✗ sibling</text>
<path d="M232,274 L232,320" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#r)"/>
<text x="238" y="300" font-size="13" fill="#C0392B" font-weight="bold">✗</text>
<path d="M110,413 C40,413 40,212 90,212" fill="none" stroke="#2E8B57" stroke-width="2.2" marker-end="url(#g)"/>
<text x="44" y="318" font-size="13" fill="#2E8B57" font-weight="bold" transform="rotate(-90 44 318)" text-anchor="middle">✓ __init__ owns _registry</text>
<text x="560" y="60" font-weight="bold" fill="#1F2937" font-size="17">The rule, copied from Rust</text>
<text x="560" y="88" fill="#1F2937"><tspan font-weight="bold">Rust</tspan>: an item without <tspan font-family="DejaVu Sans Mono, Liberation Mono, monospace">pub</tspan> is visible in its</text>
<text x="560" y="110" fill="#1F2937">module and in that module’s descendants.</text>
<text x="560" y="132" fill="#1F2937"><tspan font-weight="bold">Python</tspan>: the underscore is the missing <tspan font-family="DejaVu Sans Mono, Liberation Mono, monospace">pub</tspan>,</text>
<text x="560" y="154" fill="#1F2937">the directory is the module.</text>
<text x="560" y="190" font-weight="bold" fill="#1F2937" font-size="17">Who may import _pricing.py</text>
<text x="560" y="218" fill="#2E8B57">✓ <tspan fill="#1F2937">the owning directory: api.py</tspan></text>
<text x="560" y="240" fill="#2E8B57">✓ <tspan fill="#1F2937">its descendants: batch/job.py</tspan></text>
<text x="560" y="262" fill="#C0392B">✗ <tspan fill="#1F2937">a sibling: billing/invoice.py</tspan></text>
<text x="560" y="284" fill="#C0392B">✗ <tspan fill="#1F2937">the parent: app/main.py</tspan></text>
<text x="560" y="320" font-weight="bold" fill="#1F2937" font-size="17">A private name, _rate</text>
<text x="560" y="348" fill="#1F2937">belongs to its file. A file has no descendants,</text>
<text x="560" y="370" fill="#1F2937">so no other file imports it, api.py included.</text>
<text x="560" y="392" fill="#1F2937">exception: defined in __init__.py, then the</text>
<text x="560" y="414" fill="#1F2937">directory owns it, as _registry above.</text>
<text x="560" y="450" fill="#1F2937">No config. The underscores are already in the code.</text>
</svg>